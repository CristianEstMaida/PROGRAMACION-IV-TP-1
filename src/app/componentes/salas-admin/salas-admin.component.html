<section class="salas-admin">
  <h2>Gestión de Salas</h2>
  <button type="button" (click)="agregarSala()">➕ Agregar Sala</button>

  @if (cargando()) {
    <p>Consultando salas en Supabase...</p>
  } @else {
    <table class="salas-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>NOMBRE</th>
          <th>CAPACIDAD</th>
          <th>TIPO</th>
          <th>ESTADO</th>
          <th>ACCIONES</th>
        </tr>
      </thead>
      <tbody>
        @for (s of salas(); track s.id) {
          <tr [class.fila-inactiva]="!s.activa">
            <td>{{ s.id }}</td>
            <td>{{ s.nombre }}</td>
            <td>{{ s.capacidad }} butacas</td>
            <td>{{ s.tipo }}</td>
            <td>
              @if (s.activa) {
                <span class="badge badge-activa">Activa</span>
              } @else {
                <span class="badge badge-inactiva">Inactiva</span>
              }
            </td>
            <td>
              <button 
                type="button"
                class="btn-action" 
                [class.btn-desactivar]="s.activa"
                [class.btn-activar]="!s.activa"
                (click)="toggleEstadoSala(s)">
                @if (s.activa) {
                  🗑️ Desactivar
                } @else {
                  ✅ Habilitar
                }
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</section>
