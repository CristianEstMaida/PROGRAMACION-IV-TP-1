<header class="navbar-admin">
  
  <div class="navbar-brand">
    <span>Panel de Administración</span>
  </div>

  <div class="navbar-actions">
    <a routerLink="/home" class="btn-home-link" style="display: inline-flex; align-items: center; gap: 0.4rem; color: #cbd5e1; text-decoration: none; font-weight: 600; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15);">
      <mat-icon style="font-size: 18px; width: 18px; height: 18px;">theaters</mat-icon>
      <span>Ir a Cartelera</span>
    </a>
    
    <div class="user-profile">
      <mat-icon>account_circle</mat-icon>
      <span>{{ adminName }}</span>
    </div>

    <button type="button" class="btn-logout" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Salir</span>
    </button>
  </div>
</header>
