<section class="reportes">
  <h2>Reportes de Administración</h2>

  @if (cargando()) {
    <p class="loading-text">Cargando métricas desde la base de datos...</p>
  } @else {
    <div class="charts">
      <!-- 1. Películas más vistas -->
      <app-chart-admin 
        title="Películas más vistas" 
        [labels]="peliculasLabels()" 
        [data]="peliculasData()" 
        chartType="bar">
      </app-chart-admin>

      <!-- 2. Ventas Candy Bar -->
      <app-chart-admin 
        title="Ventas Candy Bar" 
        [labels]="candyLabels()" 
        [data]="candyData()" 
        chartType="bar">
      </app-chart-admin>
    </div>

    <!-- 3. Facturación Diaria -->
    <app-chart-admin 
      title="Facturación Diaria" 
      [labels]="facturacionLabels()" 
      [data]="facturacionData()" 
      chartType="line">
    </app-chart-admin>

    <div class="export-buttons">
      <button type="button" (click)="exportToPDF()">📄 Exportar a PDF</button>
      <button type="button" (click)="exportToExcel()">📊 Exportar a Excel</button>
    </div>
  }
</section>
