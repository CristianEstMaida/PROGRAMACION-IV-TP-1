<section class="reportes">
  <h2>Reportes de Administración</h2>

  @if (cargando()) {
    <p class="loading-text">Cargando métricas desde la base de datos...</p>
  } @else {
    @if (topCandyProducto(); as top) {
      <div style="background: rgba(34, 197, 94, 0.15); border: 1.5px solid #22c55e; border-radius: 10px; padding: 1rem 1.5rem; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
        <div>
          <span style="color: #4ade80; font-size: 0.8rem; font-weight: 800; text-transform: uppercase;">Producto Estrella Candy Bar</span>
          <h3 style="margin: 0.2rem 0 0; color: #fff; font-size: 1.3rem;">{{ top.nombre }}</h3>
        </div>
        <span style="font-size: 1.4rem; font-weight: 800; color: #facc15;">{{ top.cantidad }} u. vendidas</span>
      </div>
    }
    <div style="display: flex; gap: 0.5rem; margin-bottom: 0.8rem;">
      <button type="button" class="pill" [class.active]="periodoPeliculas() === 'historico'" (click)="cambiarPeriodo('historico')">Histórico</button>
      <button type="button" class="pill" [class.active]="periodoPeliculas() === 'mes'" (click)="cambiarPeriodo('mes')">Último Mes</button>
      <button type="button" class="pill" [class.active]="periodoPeliculas() === 'semana'" (click)="cambiarPeriodo('semana')">Última Semana</button>
    </div>
    <div class="charts">
      <!-- 1. Películas más vistas -->

      <app-chart-admin 
        title="Películas más vistas" 
        [labels]="peliculasLabels()" 
        [data]="peliculasData()" 
        chartType="bar">
      </app-chart-admin>

      <!-- 2. Ventas Candy Bar -->
      <app-chart-admin 
        title="Ventas Candy Bar" 
        [labels]="candyLabels()" 
        [data]="candyData()" 
        chartType="bar">
      </app-chart-admin>
    </div>

    <!-- 3. Facturación Diaria -->
    <app-chart-admin 
      title="Facturación Diaria" 
      [labels]="facturacionLabels()" 
      [data]="facturacionData()" 
      chartType="line">
    </app-chart-admin>

    <div class="export-buttons">
      <button type="button" (click)="exportToPDF()">📄 Exportar a PDF</button>
      <button type="button" (click)="exportToExcel()">📊 Exportar a Excel</button>
    </div>
    
  }
</section>
