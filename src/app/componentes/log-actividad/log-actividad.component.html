<section class="log-actividad">
  <h2>Log de Actividad</h2>
  <table>
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Usuario</th>
        <th>Acción</th>
        <th>Detalle</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let log of logs()">
        <td>{{ log.fecha | date:'dd/MM/yyyy HH:mm' }}</td>
        <td>{{ log.usuario }}</td>
        <td>{{ log.accion }}</td>
        <td>{{ log.detalle }}</td>
      </tr>
    </tbody>
  </table>

    <!-- Controles de Paginación debajo de la tabla -->
  <div class="paginacion-container">
    <button 
      type="button" 
      class="btn-pag" 
      (click)="paginaAnterior()" 
      [disabled]="paginaActual() === 0 || cargandoLogs()">
      ← Anterior
    </button>

    <span class="info-pag">
      Página {{ paginaActual() + 1 }} de {{ totalPaginas() }}
      <small>({{ totalLogs() }} registros)</small>
    </span>

    <button 
      type="button" 
      class="btn-pag" 
      (click)="paginaSiguiente()" 
      [disabled]="paginaActual() + 1 >= totalPaginas() || cargandoLogs()">
      Siguiente →
    </button>
  </div>
</section>
