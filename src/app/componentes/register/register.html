<div class="register">
  <div class="logo">🎥 CineNova</div>
  <h2>Tu cuenta para vivir el cine</h2>
  <p>Accedé a estrenos y funciones exclusivas</p>

  <form (submit)="onSubmit($event)">
    <!-- Email (con estado asíncrono pending/valid/error) -->
    <label class="input-icon email"
      [class.pending]="emailState() === 'pending'"
      [class.valid]="emailState() === 'valid'"
      [class.error]="emailState() === 'invalid' || registerError === 'duplicate'">
      <span class="icon"></span>✉️ Correo Electrónico:
      <div class="field-wrapper">
        <input 
          type="email" 
          [formField]="registerForm.email" 
          (blur)="onEmailBlur()"
          placeholder="ejemplo@correo.com" />
      </div>

      @if (emailState() === 'pending') {
        <span class="hint">Comprobando correo...</span>
      }
      @if (emailState() === 'invalid') {
        <span class="error">Ingresá un correo electrónico válido</span>
      }
      @if (registerError === 'duplicate') {
        <span class="error">Ese correo electrónico ya está registrado</span>
      }
    </label>

    <!-- Contraseña -->
    <label class="input-icon password"
      [class.valid]="registerModel().password.length >= 8"
      [class.error]="registerModel().password.length > 0 && registerModel().password.length < 8">
      <span class="icon"></span>🔒 Contraseña:
      <div class="field-wrapper">
        <input type="password" [formField]="registerForm.password" placeholder="Mínimo 8 caracteres" />
      </div>
      @if (registerModel().password.length > 0 && registerModel().password.length < 8) {
        <span class="error">Mínimo 8 caracteres</span>
      }
    </label>

    <!-- Confirmar Contraseña -->
    <label class="input-icon password"
      [class.valid]="registerModel().confirmPassword && registerModel().password === registerModel().confirmPassword"
      [class.error]="registerModel().confirmPassword && registerModel().password !== registerModel().confirmPassword">
      <span class="icon"></span>🔒 Confirmar Contraseña:
      <div class="field-wrapper">
        <input type="password" [formField]="registerForm.confirmPassword" placeholder="Repetí tu contraseña" />
      </div>
      @if (registerModel().confirmPassword && registerModel().password !== registerModel().confirmPassword) {
        <span class="error">Las contraseñas no coinciden</span>
      }
    </label>

    <!-- Nombre -->
    <label class="input-icon user"
      [class.valid]="registerModel().nombre.trim().length > 1">
      <span class="icon"></span>👤 Nombre:
      <div class="field-wrapper">
        <input type="text" [formField]="registerForm.nombre" placeholder="Tu nombre" />
      </div>
    </label>

    <!-- Apellido -->
    <label class="input-icon user"
      [class.valid]="registerModel().apellido.trim().length > 1">
      <span class="icon"></span>👤 Apellido:
      <div class="field-wrapper">
        <input type="text" [formField]="registerForm.apellido" placeholder="Tu apellido" />
      </div>
    </label>

    <!-- Fecha de Nacimiento -->
    <!-- Fecha de Nacimiento (sin datepicker, alineada) -->
    <div class="custom-date-group">
      <span>📅 Fecha de Nacimiento:</span>
      <div class="date-inputs-row">
        <input 
          type="number" 
          placeholder="Día" 
          [(ngModel)]="diaNac" 
          (input)="actualizarFechaNacimiento()"
          name="dia"
          class="date-part-input" />

        <select 
          [(ngModel)]="mesNac" 
          (change)="actualizarFechaNacimiento()"
          name="mes"
          class="date-part-input">
          <option value="" disabled selected>Mes</option>
          <option value="01">Enero</option>
          <option value="02">Febrero</option>
          <option value="03">Marzo</option>
          <option value="04">Abril</option>
          <option value="05">Mayo</option>
          <option value="06">Junio</option>
          <option value="07">Julio</option>
          <option value="08">Agosto</option>
          <option value="09">Septiembre</option>
          <option value="10">Octubre</option>
          <option value="11">Noviembre</option>
          <option value="12">Diciembre</option>
        </select>

        <input 
          type="number" 
          placeholder="Año" 
          [(ngModel)]="anioNac" 
          (input)="actualizarFechaNacimiento()"
          name="anio"
          class="date-part-input" />
      </div>
    </div>

    <!-- Tipo de Sangre -->
    <label class="input-icon user valid">
      <span>Tipo de Sangre:</span>
      <div class="field-wrapper">
        <select [formField]="registerForm.tipo_sangre" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border);">
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
          <option value="O+" selected>O+</option>
          <option value="O-">O-</option>
        </select>
      </div>
    </label>

    <!-- Color de Ojos -->
    <label class="input-icon user valid">
      <span>Color de Ojos:</span>
      <div class="field-wrapper">
        <select [formField]="registerForm.color_ojos" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border);">
          <option value="Marrones" selected>Marrones</option>
          <option value="Azules">Azules</option>
          <option value="Verdes">Verdes</option>
          <option value="Miel / Pardos">Miel / Pardos</option>
          <option value="Negros">Negros</option>
        </select>
      </div>
    </label>

    <!-- Días de Vacaciones por Año -->
    <label class="input-icon user valid">
    <span>Días de Vacaciones Anuales:</span>
    <div class="field-wrapper">
      <input type="number" [formField]="registerForm.dias_vacaciones" placeholder="Ej: 14" />
    </div>
  </label>

    <!-- Términos y condiciones -->
    <label class="checkbox-label">
      <input type="checkbox" [formField]="registerForm.aceptaTerminos" />
      Acepto términos y condiciones
    </label>

    <button type="submit"
      [disabled]="emailState() !== 'valid'
                  || registerModel().password.length < 8 
                  || registerModel().password !== registerModel().confirmPassword
                  || !registerModel().nombre.trim() 
                  || !registerModel().apellido.trim() 
                  || !registerModel().fechaNacimiento 
                  || !registerModel().aceptaTerminos">
      Registrarme
    </button>
  </form>

  <a routerLink="/login">¿Ya tenés cuenta? Iniciar sesión</a>
</div>
