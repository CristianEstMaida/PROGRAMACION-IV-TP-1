<div class="admin-dashboard">
  <app-navbar-admin></app-navbar-admin>
  <div class="layout">
    <app-sidebar-admin></app-sidebar-admin>

    <section class="content">
      @if (cargando()) {
        <p class="loading-state">Cargando métricas y gráficos del cine...</p>
      } @else {
        <!-- Tarjetas Superiores de Métricas -->
        <div class="metrics">
          @for (m of metrics(); track m.title) {
            <div class="metric-card" [style.background]="m.color">
              <mat-icon>{{ m.icon }}</mat-icon>
              <h3>{{ m.title }}</h3>
              <p>{{ m.value }}</p>
            </div>
          }
        </div>

        <!-- Botones de Acción Rápida -->
        <div class="actions">
          @for (a of quickActions; track a.label) {
            <button 
              [style.background]="a.color" 
              [routerLink]="a.route" 
              class="action-btn">
              <mat-icon>{{ a.icon }}</mat-icon>
              {{ a.label }}
            </button>
          }
        </div>

        <!-- Gráficos con Datos Reales de Supabase -->
        <div class="charts">
          <app-chart-admin 
            title="Películas más vistas" 
            [labels]="peliculasLabels()" 
            [data]="peliculasData()" 
            chartType="bar">
          </app-chart-admin>

          <app-chart-admin 
            title="Ventas Candy Bar" 
            [labels]="candyLabels()" 
            [data]="candyData()" 
            chartType="bar">
          </app-chart-admin>
        </div>

        <app-chart-admin 
          title="Facturación Diaria" 
          [labels]="facturacionLabels()" 
          [data]="facturacionData()" 
          chartType="line">
        </app-chart-admin>
      }

      <router-outlet></router-outlet>
    </section>
  </div>
</div>
