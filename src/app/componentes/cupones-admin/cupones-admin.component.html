<section class="cupones-admin">
  <h2>Gestión de Cupones</h2>

  <button (click)="agregarCupon()">➕ Agregar Cupón</button>

  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Descuento</th>
        <th>Inicio</th>
        <th>Fin</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of cupones">
        <td><strong>{{ c.codigo | uppercase }}</strong></td>
        <td>{{ c.descuento / 100 | percent:'1.0-0' }}</td>
        <td>{{ c.fechaInicio | date:'dd/MM/yyyy' }}</td>
        <td>{{ c.fechaFin | date:'dd/MM/yyyy' }}</td>
        <td>
          <span [ngClass]="c.activo ? 'activo' : 'inactivo'">
            {{ c.activo ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
        <td>
          <button (click)="toggleActivo(c)">
            {{ c.activo ? 'Desactivar' : 'Activar' }}
          </button>
          <button (click)="eliminarCupon(c.id)">🗑️ Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</section>
