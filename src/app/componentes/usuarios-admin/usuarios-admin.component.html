@if (cargando()) {
  <p>Cargando perfiles...</p>
} @else {
  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (u of usuarios(); track u.id) {
        <tr>
          <td>{{ u.nombre }} {{ u.apellido || '' }}</td>
          <td>{{ u.email }}</td>
          <td>
            <select [value]="u.rol" (change)="cambiarRolDesdeEvento(u, $event)">
              <option value="cliente">Cliente</option>
              <option value="operador">Operador</option>
              <option value="admin">Admin</option>
            </select>
          </td>
          <td>
            <button (click)="toggleActivo(u)">
              {{ u.activo ? '✅ Activo' : '⛔ Inactivo' }}
            </button>
          </td>
          <td>
            <button 
              appConfirmDelete 
              (confirmed)="eliminarUsuario(u.id)">
              🗑️ Eliminar
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5">No hay usuarios registrados.</td>
        </tr>
      }
    </tbody>
  </table>
}
